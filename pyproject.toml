[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harmony-eaca"
version = "0.1.0"
description = "Проект «Гармония» — EACA: вычислимое ядро этики"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Сергей Лукьянов" }]
keywords = ["ethics", "eaca", "harmony", "alignment"]
dependencies = []

[project.urls]
Homepage = "https://github.com/bbcmpsu/-"
Repository = "https://github.com/bbcmpsu/-"

[project.scripts]
harmony-build-pdf = "tools.build_pdf:main"

[tool.setuptools]
packages = ["eaca", "nodes"]
